name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    # 테스트에 실제 PostgreSQL이 필요하므로 CI 러너 안에 컨테이너로 띄운다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gifty_test
          POSTGRES_USER: gifty_user
          POSTGRES_PASSWORD: gifty_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Jest 테스트 실행
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gifty_test
          DB_USER: gifty_user
          DB_PASSWORD: gifty_pass
          JWT_SECRET: ci_test_secret_key
          JWT_EXPIRES_IN: 7d
          PORTONE_V2_API_SECRET: '' # 비워서 mock 결제 모드로 강제
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 프로덕션 빌드 확인
        run: npm run build
